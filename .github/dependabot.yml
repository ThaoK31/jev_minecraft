version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minecraft-runtime:
        patterns:
          - "mineflayer*"
          - "minecraft-data"
          - "prismarine-*"
      web-runtime:
        patterns:
          - "express"
          - "socket.io"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
